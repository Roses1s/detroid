{% extends "base.html" %}
{% block title %}Смена пароля — {{ app_name }}{% endblock %}

{% block content %}
<div class="o_login_wrap">
  <div class="o_login_card">
    <div class="o_login_card__logo">
      <span class="o_login_card__icon">🔒</span>
      <h1>Смена пароля</h1>
      <p class="muted o_login_card__sub">{{ current_user.display_name }}</p>
    </div>

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="o_field_row">
        <label class="o_label" style="display:block;margin-bottom:3px" for="password">Текущий пароль</label>
        <input class="input" type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div class="o_field_row">
        <label class="o_label" style="display:block;margin-bottom:3px" for="new_password">Новый пароль</label>
        <input class="input" type="password" id="new_password" name="new_password" required
               placeholder="мин. 6 символов" autocomplete="new-password">
      </div>
      <div class="o_field_row">
        <label class="o_label" style="display:block;margin-bottom:3px" for="new_password2">Новый пароль ещё раз</label>
        <input class="input" type="password" id="new_password2" name="new_password2" required autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn--primary btn--block">Сменить пароль</button>
    </form>

    <p class="o_login_card__hint">
      <a href="{{ url_for('main.dashboard') }}">Отмена — вернуться на главную</a>
    </p>
  </div>
</div>
{% endblock %}
