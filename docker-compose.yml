# Logistics CRM — docker-compose
# Три контейнера:
#   db    — PostgreSQL 15 (данные лежат в volume pgdata, переживают перезапуск)
#   app   — Flask (Gunicorn), собирается из ./app/Dockerfile
#   nginx — reverse proxy: принимает 80/443, отдаёт статику и проксирует в app

services:
  db:
    image: postgres:15-alpine
    container_name: crm_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: crm_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_password_change_me}@db:5432/${POSTGRES_DB:-crm}
      FLASK_ENV: ${FLASK_ENV:-production}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # curl есть в образе (ставится в Dockerfile); /health — лёгкий маршрут без входа
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "5000"
    ports:
      # Нужен для отладки напрямую. В продакшене можно убрать, оставив только nginx.
      - "127.0.0.1:5000:5000"
    volumes:
      # Чтобы правки шаблонов/статики применялись без пересборки (удобно на старте).
      # Когда проект стабилизируется — убери этот volume и пересобирай образ.
      - ./app/templates:/code/app/templates:ro
      - ./app/static:/code/app/static:ro
    command: >
      sh -c "
        flask db upgrade || exit 1;
        python -m app.seed || true;
        gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 'wsgi:app'
      "

  nginx:
    image: nginx:1.25-alpine
    container_name: crm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Статика напрямую из исходников (см. комментарий выше про volume app)
      - ./app/static:/srv/static:ro
    depends_on:
      - app

volumes:
  pgdata:
