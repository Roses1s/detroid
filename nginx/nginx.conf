# Nginx — reverse proxy для CRM.
#   :80  — HTTP. Если есть домен и SSL — редиректим на HTTPS.
#   :443 — HTTPS (раскомментируй server-блок, когда положишь сертификаты в nginx/ssl/).
# Статику /static/ отдаём напрямую (быстро, не дёргая Python).

upstream crm_app {
    server app:5000;
}

# ── HTTP ──────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Статика напрямую
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        # Если настроен HTTPS — раскомментируй 2 строки ниже,
        # чтобы весь HTTP уходил на HTTPS:
        # if ($host != "localhost") {
        #     return 301 https://$host$request_uri;
        # }
        proxy_pass http://crm_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

